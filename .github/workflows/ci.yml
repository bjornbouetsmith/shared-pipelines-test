# Tiny caller: all CI logic lives in bjornbouetsmith/shared-pipelines.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  statuses: write   # set-commit-status and sonar-publish-status

jobs:
  build:
    uses: bjornbouetsmith/shared-pipelines/.github/workflows/dotnet-ci-build.yml@v1.1.1
    with:
      solution: SharedPipelines.Sample.slnx
      # Publish continuous-integration/build pending -> success/failure.
      set-commit-status: true
      # SonarCloud analysis around build and test; publishes
      # continuous-integration/sonarcloud pending -> success/failure.
      sonar: true
      sonar-project-key: bjornbouetsmith_shared-pipelines-test
      sonar-organization: bjornbouetsmith
      sonar-coverage-reports: '**/coverage.opencover.xml'
      test-args: >-
        --verbosity normal
        --settings tests/coverlet.runsettings
    secrets:
      # The repository secret is called SONAR_TOKEN; the reusable workflow
      # expects "sonar-token", so it has to be mapped explicitly.
      sonar-token: ${{ secrets.SONAR_TOKEN }}
