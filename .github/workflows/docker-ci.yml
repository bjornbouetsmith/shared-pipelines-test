# Docker-aware CI caller: all Docker and build logic lives in
# bjornbouetsmith/shared-pipelines.
#
# The shared pipeline starts docker/docker-compose.yml, waits for the nginx
# service on http://127.0.0.1:8080/ and runs the integration test with
# SERVICE_URL exported through test-env.
name: Docker CI

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: bjornbouetsmith/shared-pipelines/.github/workflows/dotnet-docker-ci-build.yml@v1.4.0
    with:
      working-directory: docker
      solution: SharedPipelines.Docker.slnx
      docker-compose-files: docker-compose.yml
      docker-compose-project-name: shared-pipelines-docker-${{ github.run_id }}
      wait-for-urls: http://127.0.0.1:8080/
      wait-timeout-seconds: 120
      wait-interval-seconds: 2
      test-env: SERVICE_URL=http://127.0.0.1:8080/
      test-results-directory: TestResults
      upload-test-results: true
      artifact-name: docker-test-results
